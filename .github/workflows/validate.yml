name: validate

on:
  push:
  pull_request:
  schedule:
    # HACS and hassfest both fail on things Home Assistant changed rather than on things we did,
    # so this runs on a schedule as well as on a push.
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
